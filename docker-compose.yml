services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: voltia
      POSTGRES_PASSWORD: voltia
      POSTGRES_DB: voltia
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voltia -d voltia"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
